name: daily

# Collect intervals.icu + the coach's sheet, then rebuild daily_load. Steps run in order and
# stop at the first failure, so compute never runs on half-collected data.
# Note: GitHub disables scheduled workflows in public repos after 60 days without a commit;
# re-enable under Actions → daily if that happens.

on:
  # 05:00, 12:00 and 20:00 Copenhagen all year (user, 2026-10-01: planned kg must be seen before
  # same-day sessions). Cron is UTC, so both offsets are scheduled and the gate job keeps the
  # three whose Copenhagen hour (scheduled UTC hour + today's offset) is 05, 12 or 20.
  schedule:
    - cron: "0 3 * * *" # 05 CEST
    - cron: "0 4 * * *" # 05 CET
    - cron: "0 10 * * *" # 12 CEST
    - cron: "0 11 * * *" # 12 CET
    - cron: "0 18 * * *" # 20 CEST
    - cron: "0 19 * * *" # 20 CET
  workflow_dispatch:
    inputs:
      since:
        description: "collect-intervals --since YYYY-MM-DD (empty = last 14 days; 2024-12-30 = full backfill)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.hour.outputs.run }}
    steps:
      - id: hour
        env:
          SCHEDULE: ${{ github.event.schedule }}
        # The scheduled hour, not the clock: a delayed run still maps to its slot.
        run: |
          if [ -z "$SCHEDULE" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          utc_hour=$(echo "$SCHEDULE" | awk '{print $2}')
          offset=$(TZ=Europe/Copenhagen date +%z | cut -c2-3)
          local_hour=$(( (10#$utc_hour + 10#$offset) % 24 ))
          case "$local_hour" in 5|12|20) run=true ;; *) run=false ;; esac
          echo "UTC $utc_hour + $offset h = $local_hour Copenhagen: run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  collect-and-compute:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # On the job, not the workflow: a skipped slot never waits in (or replaces a run in) the group.
    concurrency:
      group: daily-load # strength_sets is replaced with delete + insert; never overlap two runs
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev

      # Every secret of every step, checked at once: one run lists all config mistakes.
      # Keep this env block in sync with the steps below and config.all_problems.
      - name: check-config
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BODYWEIGHT: ${{ secrets.BODYWEIGHT }}
          STRENGTH_K: ${{ secrets.STRENGTH_K }}
        run: uv run --no-dev check-config

      - name: collect-intervals
        env:
          SINCE: ${{ inputs.since }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: uv run --no-dev collect-intervals ${SINCE:+--since "$SINCE"}

      - name: collect-strength
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BODYWEIGHT: ${{ secrets.BODYWEIGHT }}
        run: uv run --no-dev collect-strength

      - name: compute
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STRENGTH_K: ${{ secrets.STRENGTH_K }}
        run: uv run --no-dev compute

      # Planned rides don't feed daily_load: last, so a plan problem never blocks compute.
      - name: collect-plan
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: uv run --no-dev collect-plan
