name: daily

# Collect intervals.icu + the coach's sheet, then rebuild daily_load. Steps run in order and
# stop at the first failure, so compute never runs on half-collected data.
# Note: GitHub disables scheduled workflows in public repos after 60 days without a commit;
# re-enable under Actions → daily if that happens.

on:
  # 05, 12 and 20 Copenhagen all year (user, 2026-10-01: planned kg must be seen before same-day
  # sessions). Cron is UTC, so both offsets are scheduled and the gate job keeps the three whose
  # Copenhagen hour (scheduled UTC hour + today's offset) is 05, 12 or 20.
  # Never on :00 or :30 (user, 2026-10-02): GitHub schedules are best-effort and the start of the
  # hour is its busiest time; on :00 the first runs started 4-7 h late or not at all. CEST twins
  # run at :07, CET twins at :37 (05:07/12:07/20:07 in summer, 05:37/12:37/20:37 in winter).
  schedule:
    - cron: "7 3 * * *" # 05 CEST
    - cron: "37 4 * * *" # 05 CET
    - cron: "7 10 * * *" # 12 CEST
    - cron: "37 11 * * *" # 12 CET
    - cron: "7 18 * * *" # 20 CEST
    - cron: "37 19 * * *" # 20 CET
  # The primary trigger (user, 2026-10-02): the DigitalOcean droplet dispatches at 05, 12 and 20
  # Copenhagen with slot=05|12|20 and ref main; the schedule above is the backup. The gate runs
  # collect-and-compute once per slot, whichever comes first. A manual run without slot (e.g. a
  # backfill with since) always runs.
  workflow_dispatch:
    inputs:
      since:
        description: "collect-intervals --since YYYY-MM-DD (empty = last 14 days; 2024-12-30 = full backfill)"
        required: false
        default: ""
      slot:
        description: "05, 12 or 20: a scheduled slot (the droplet's call; runs once per slot). Empty = a manual run that always runs."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Once per slot: .github/scripts/gate.py (tests: python/tests/test_gate.py). It reads this
  # workflow's other runs with the job's own token (actions: read); no secrets here.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # it may wait up to 15 min for another run of the slot to finish
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SLOT: ${{ inputs.slot }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/gate.py

  collect-and-compute:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    # On the job, not the workflow: a skipped slot never waits in (or replaces a run in) the group.
    concurrency:
      group: daily-load # strength_sets is replaced with delete + insert; never overlap two runs
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked --no-dev

      # Every secret of every step, checked at once: one run lists all config mistakes.
      # Keep this env block in sync with the steps below and config.all_problems.
      - name: check-config
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BODYWEIGHT: ${{ secrets.BODYWEIGHT }}
          STRENGTH_K: ${{ vars.STRENGTH_K }} # a tunable, not a secret: Settings → Variables
        run: uv run --no-dev check-config

      - name: collect-intervals
        env:
          SINCE: ${{ inputs.since }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: uv run --no-dev collect-intervals ${SINCE:+--since "$SINCE"}

      - name: collect-strength
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          BODYWEIGHT: ${{ secrets.BODYWEIGHT }}
        run: uv run --no-dev collect-strength

      - name: compute
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STRENGTH_K: ${{ vars.STRENGTH_K }} # a tunable, not a secret: Settings → Variables
        run: uv run --no-dev compute

      # Planned rides don't feed daily_load: last, so a plan problem never blocks compute.
      - name: collect-plan
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: uv run --no-dev collect-plan
